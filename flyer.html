<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; font-family:'Open Sans',sans-serif;
    background: linear-gradient(160deg, #A0D1FA 0%, #B7DBF9 42%, #EAF4FD 68%, #F9F3E7 100%);
    display:flex; flex-direction:column; align-items:center; position:relative; color:#37474F; }
  .logo { margin-top:56px; width:400px; position:relative;
    filter: drop-shadow(0 4px 18px rgba(255,255,255,.95)) drop-shadow(0 2px 6px rgba(55,71,79,.18)); }
  h1 { margin-top:30px; font-size:72px; font-weight:800; color:#37474F; text-align:center; line-height:1.18; position:relative; }
  h1 .hl { color:#E8A800; }
  .sub { margin-top:18px; font-size:34px; font-weight:700; color:#37474F; text-align:center; padding:0 60px; position:relative; }
  .chips { margin-top:32px; display:flex; flex-direction:column; gap:15px; position:relative; }
  .chip { background: rgba(255,255,255,.85); border:3px solid #E8A800; border-radius:999px;
    padding:13px 36px; font-size:30px; font-weight:700; color:#37474F; display:flex; align-items:center; gap:14px;
    box-shadow: 0 4px 14px rgba(55,71,79,.10); }
  .chip:nth-child(2) { border-color:#4A90C2; }
  .chip:nth-child(3) { border-color:#FF7BAC; }
  .chip .dot { width:18px; height:18px; min-width:18px; border-radius:50%; background:#E8A800; }
  .chip:nth-child(2) .dot { background:#4A90C2; }
  .chip:nth-child(3) .dot { background:#FF7BAC; }
  .cta { margin-top:32px; font-size:48px; font-weight:800; color:#37474F; position:relative; }
  .qrbox { margin-top:18px; background:#ffffff; padding:20px; border-radius:28px; position:relative;
    border:5px solid #E8A800; box-shadow:0 12px 34px rgba(55,71,79,.20); }
  .collab { position:absolute; bottom:34px; display:flex; align-items:center; gap:20px; }
  .collab img { height:72px; }
  .collab span { font-size:25px; font-weight:700; color:#37474F; }
  .spark { position:absolute; }
</style>
</head>
<body>
  <svg class="spark" style="top:90px; right:70px" width="70" height="70" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z" fill="#E8A800" opacity=".85"/></svg>
  <svg class="spark" style="top:330px; left:64px" width="48" height="48" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z" fill="#FF7BAC" opacity=".8"/></svg>
  <svg class="spark" style="bottom:430px; right:80px" width="54" height="54" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z" fill="#4A90C2" opacity=".8"/></svg>
  <svg class="spark" style="top:220px; left:90px" width="80" height="80" viewBox="0 0 90 90"><g transform="rotate(-18 45 45)"><rect x="25" y="32" width="40" height="26" rx="13" fill="#E8A800"/><polygon points="25,45 8,32 8,58" fill="#ffffff"/><polygon points="65,45 82,32 82,58" fill="#ffffff"/></g></svg>
  <svg class="spark" style="bottom:330px; left:70px" width="64" height="64" viewBox="0 0 90 90"><g transform="rotate(30 45 45)"><rect x="25" y="32" width="40" height="26" rx="13" fill="#43C59E"/><polygon points="25,45 8,32 8,58" fill="#FFC727"/><polygon points="65,45 82,32 82,58" fill="#FFC727"/></g></svg>
  <svg class="spark" style="bottom:180px; right:120px" width="44" height="44" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z" fill="#43C59E" opacity=".75"/></svg>

  <img class="logo" src="assets/taamim-logo.png" alt="טעמים">
  <h1>עולים <span class="hl">רמה</span> בקריאת התורה! 🎮</h1>
  <p class="sub">משחקים, אנימציות ונקודות ממתקים שאוספים תוך כדי הלימוד 🍬</p>

  <div class="chips">
    <div class="chip"><span class="dot"></span>המורה שלך איתך צעד אחר צעד</div>
    <div class="chip"><span class="dot"></span>פיילוט חינם למצטרפים עכשיו - בלי התחייבות</div>
    <div class="chip"><span class="dot"></span>ועוד תוספות מגניבות בדרך אליך</div>
  </div>

  <p class="cta">סורקים ונרשמים לפיילוט!</p>
  <div class="qrbox"><div id="qr"></div></div>

  <div class="collab">
    <span>בשיתוף פעולה עם רשת אמי"ת</span>
    <img src="assets/amit-logo-dark.png" alt="רשת אמי"ת">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById('qr'), { text: 'https://taamim-audio.github.io/pilot/', width: 230, height: 230, correctLevel: QRCode.CorrectLevel.M });
  </script>
</body>
</html>
