<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; font-family:'Open Sans',sans-serif;
    background: linear-gradient(160deg, #A0D1FA 0%, #B7DBF9 55%, #d6eafb 100%);
    display:flex; flex-direction:column; align-items:center; position:relative; }
  .candy { position:absolute; opacity:.9; }
  .badge { margin-top:34px; width:170px; height:170px; border-radius:50%;
    background:#FFC727; border:9px solid #fff; box-shadow:0 8px 24px rgba(55,71,79,.25);
    display:flex; align-items:center; justify-content:center;
    font-size:52px; font-weight:800; color:#37474F; }
  h1 { margin-top:22px; font-size:68px; font-weight:800; color:#37474F; text-align:center; line-height:1.15; }
  .sub { margin-top:14px; font-size:34px; font-weight:700; color:#37474F; text-align:center; padding:0 50px; }
  .points { margin-top:24px; background:#F9F3E7; border:5px dashed #FFC727; border-radius:32px;
    padding:24px 46px; width:840px; }
  .points div { font-size:33px; font-weight:700; color:#37474F; margin:10px 0; display:flex; align-items:center; gap:16px; }
  .dot { width:22px; height:22px; min-width:22px; border-radius:50%; background:#FFC727; border:4px solid #37474F; }
  .cta { margin-top:24px; font-size:46px; font-weight:800; color:#37474F; }
  .qrbox { margin-top:16px; background:#fff; padding:18px; border-radius:24px; box-shadow:0 8px 24px rgba(55,71,79,.2); }
  .url { margin-top:14px; font-size:28px; font-weight:700; color:#37474F; direction:ltr; }
  .note { margin-top:8px; font-size:23px; font-weight:600; color:#5a6b73; }
  .foot { position:absolute; bottom:16px; font-size:22px; font-weight:600; color:#5a6b73; }
</style>
</head>
<body>
  <svg class="candy" style="top:120px; right:60px" width="90" height="90" viewBox="0 0 90 90"><g transform="rotate(25 45 45)"><rect x="25" y="32" width="40" height="26" rx="13" fill="#FFC727" stroke="#37474F" stroke-width="4"/><polygon points="25,45 8,32 8,58" fill="#fff" stroke="#37474F" stroke-width="4"/><polygon points="65,45 82,32 82,58" fill="#fff" stroke="#37474F" stroke-width="4"/></g></svg>
  <svg class="candy" style="top:420px; left:70px" width="70" height="70" viewBox="0 0 90 90"><g transform="rotate(-20 45 45)"><rect x="25" y="32" width="40" height="26" rx="13" fill="#F9F3E7" stroke="#37474F" stroke-width="4"/><polygon points="25,45 8,32 8,58" fill="#FFC727" stroke="#37474F" stroke-width="4"/><polygon points="65,45 82,32 82,58" fill="#FFC727" stroke="#37474F" stroke-width="4"/></g></svg>
  <svg class="candy" style="bottom:200px; right:90px" width="80" height="80" viewBox="0 0 90 90"><g transform="rotate(40 45 45)"><rect x="25" y="32" width="40" height="26" rx="13" fill="#FFC727" stroke="#37474F" stroke-width="4"/><polygon points="25,45 8,32 8,58" fill="#fff" stroke="#37474F" stroke-width="4"/><polygon points="65,45 82,32 82,58" fill="#fff" stroke="#37474F" stroke-width="4"/></g></svg>
  <svg class="candy" style="top:36px; left:22%" width="60" height="60" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z" fill="#fff" stroke="#37474F" stroke-width="1.2"/></svg>
  <svg class="candy" style="bottom:330px; left:110px" width="50" height="50" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z" fill="#FFC727" stroke="#37474F" stroke-width="1.2"/></svg>

  <div class="badge">טעמים</div>
  <h1>לומדים לקרוא בתורה<br>בכיף אמיתי! 🎮✨</h1>
  <p class="sub">משחקים, אנימציות ונקודות ממתקים שאוספים תוך כדי 🍬</p>
  <div class="points">
    <div><span class="dot"></span>המורה שלך איתך צעד-צעד</div>
    <div><span class="dot"></span>פיילוט חינם למצטרפים עכשיו — בלי שום התחייבות</div>
    <div><span class="dot"></span>ועוד תוספות מגניבות בדרך אליך</div>
  </div>
  <p class="cta">סורקים ונרשמים לפיילוט!</p>
  <div class="qrbox"><div id="qr"></div></div>
  <p class="url">taamim-audio.github.io/pilot</p>
  <p class="foot">צוות טעמים</p>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById('qr'), { text: 'https://taamim-audio.github.io/pilot/', width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  </script>
</body>
</html>
